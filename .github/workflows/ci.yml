name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Configuração para forçar Node.js 24 em todas as ações
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
      # Variáveis do Supabase (Essenciais para o Build)
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      
      # Outras variáveis de ambiente
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
      STRIPE_YEARLY_PRICE_ID: ${{ secrets.STRIPE_YEARLY_PRICE_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      COMPANY_LEGAL_NAME: ${{ secrets.COMPANY_LEGAL_NAME }}
      COMPANY_TAX_ID: ${{ secrets.COMPANY_TAX_ID }}
      COMPANY_ADDRESS: ${{ secrets.COMPANY_ADDRESS }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Instalar Dependências
        run: npm ci
      - name: Validar Configuração de Segredos
        run: |
          echo "Verificando presença de variáveis críticas (sem mostrar valores)..."
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && echo "✅ NEXT_PUBLIC_SUPABASE_URL presente" || echo "❌ NEXT_PUBLIC_SUPABASE_URL ausente"
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && echo "✅ NEXT_PUBLIC_SUPABASE_ANON_KEY presente" || echo "❌ NEXT_PUBLIC_SUPABASE_ANON_KEY ausente"
          required_vars="NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_TURNSTILE_SITE_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_MONTHLY_PRICE_ID STRIPE_YEARLY_PRICE_ID NEXT_PUBLIC_SITE_URL COMPANY_LEGAL_NAME COMPANY_TAX_ID COMPANY_ADDRESS"
          missing=0
          for var_name in $required_vars; do
            if [ -n "$(printenv "$var_name")" ]; then
              echo "✅ $var_name presente"
            else
              echo "❌ $var_name ausente"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
      - name: Checagem de Tipos (TypeScript)
        run: npx tsc --noEmit
      - name: Testes automatizados
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: Auditoria de Dependencias de Producao
        run: npm audit --omit=dev --audit-level=high
      - name: Build de Produção (Next.js)
        run: npm run build
