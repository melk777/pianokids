<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pianify</title>
  <desc id="desc">Tecla de piano com uma nota musical em azul e rosa.</desc>
  <defs>
    <linearGradient id="background" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10131d"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="accent" x1="136" y1="118" x2="390" y2="402" gradientUnits="userSpaceOnUse">
